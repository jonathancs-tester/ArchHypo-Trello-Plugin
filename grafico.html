<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchHypo Metrics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Importa Chart.js -->
</head>
<body>
    <h3>ArchHypo Metrics</h3>
    <canvas id="metricsChart"></canvas>

    <script>
        var t = window.TrelloPowerUp.iframe(); // Obtém os dados enviados pelo Power-Up

        t.args('incerteza', 'impacto').then(function (args) {
            let levels = ["Muito Baixo", "Baixo", "Médio", "Alto", "Muito Alto"];
            let incertezaValues = levels.map(l => args.incerteza[l] || 0);
            let impactoValues = levels.map(l => args.impacto[l] || 0);

            let ctx = document.getElementById('metricsChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: levels,
                    datasets: [
                        {
                            label: "Incerteza",
                            data: incertezaValues,
                            backgroundColor: "rgba(54, 162, 235, 0.7)",
                            borderColor: "rgba(54, 162, 235, 1)",
                            borderWidth: 1
                        },
                        {
                            label: "Impacto",
                            data: impactoValues,
                            backgroundColor: "rgba(255, 99, 132, 0.7)",
                            borderColor: "rgba(255, 99, 132, 1)",
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
