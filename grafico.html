<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchHypo Metrics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Importa Chart.js -->
</head>
<body>
    <h3>ArchHypo Metrics</h3>
    <canvas id="metricsChart"></canvas>

    <script>
        // Pega os parâmetros da URL
        const urlParams = new URLSearchParams(window.location.search);
        const incerteza = JSON.parse(urlParams.get('incerteza'));
        const impacto = JSON.parse(urlParams.get('impacto'));

        let levels = ["Muito Baixo", "Baixo", "Médio", "Alto", "Muito Alto"];
        let incertezaValues = levels.map(l => incerteza[l] || 0);
        let impactoValues = levels.map(l => impacto[l] || 0);

        let ctx = document.getElementById('metricsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: levels,
                datasets: [
                    {
                        label: "Incerteza",
                        data: incertezaValues,
                        backgroundColor: "rgba(54, 162, 235, 0.7)",
                        borderColor: "rgba(54, 162, 235, 1)",
                        borderWidth: 1
                    },
                    {
                        label: "Impacto",
                        data: impactoValues,
                        backgroundColor: "rgba(255, 99, 132, 0.7)",
                        borderColor: "rgba(255, 99, 132, 1)",
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
