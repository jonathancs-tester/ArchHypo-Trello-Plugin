<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchHypo Metrics</title>
  <style>
    .popup-content {
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script>
    TrelloPowerUp.initialize({
      'card-buttons': function (t, options) {
          return [
              {
                  icon: "https://img.icons8.com/ios/50/000000/process.png",
                  text: "Adicionar Campos de Incerteza",
                  callback: function (t) {
                      return t.card('desc') // Obtém a descrição do card
                          .then(function (card) {
                              const descricao = card.desc || "";
                              
                              // Função para extrair valores da descrição
                              function extrairValor(chave) {
                                  const regex = new RegExp(`\\*\\*${chave}:\\s*\\*\\*\\s*(.*)`, "i");
                                  const match = descricao.match(regex);
                                  return match ? match[1].trim() : "";
                              }

                              // Extraindo valores da descrição
                              const dominio_problema = extrairValor("Domínio") || "Não encotrado";
                              const ponto_alerta = extrairValor("Ponto de Alerta") || "Não encotrado";
                              const hipotese = extrairValor("Hipótese") || "Não encotrado";
                              const incerteza = extrairValor("Incerteza") || "Não encotrado";
                              const impacto = extrairValor("Impacto") || "Não encotrado";
                              const plano = extrairValor("Plano") || "Não encotrado";

                              // Salvar os valores no `shared` do Trello
                              return t.set('card', 'shared', {
                                  dominio_problema,
                                  ponto_alerta,
                                  hipotese,
                                  incerteza,
                                  impacto,
                                  plano
                              }).then(function () {
                                  return t.alert({
                                      message: "Campos adicionados com sucesso!",
                                      duration: 3,
                                      display: "success"
                                  });
                              });
                          });
                  }
              }
          ];
      },

      'board-buttons': function (t, options) {
        return [
          {
            icon: "https://img.icons8.com/ios/50/000000/combo-chart.png",
            text: "ArchHypo Metrics",
            callback: function (t) {
              return t.cards('all').then(function (cards) {
                if (!cards || cards.length === 0) {
                  return t.popup({
                    title: 'Erro',
                    items: [{ text: 'Nenhum cartão encontrado!', interactive: false }]
                  });
                }

                let levels = ["Muito Baixo", "Baixo", "Médio", "Alto", "Muito Alto"];
                let countIncerteza = { "Muito Baixo": 0, "Baixo": 0, "Médio": 0, "Alto": 0, "Muito Alto": 0 };
                let countImpacto = { "Muito Baixo": 0, "Baixo": 0, "Médio": 0, "Alto": 0, "Muito Alto": 0 };

                let cardPromises = cards.map(function (card) {
                  return Promise.all([
                    t.get(card.id, 'shared', 'incerteza'),
                    t.get(card.id, 'shared', 'impacto')
                  ]).then(function ([incerteza, impacto]) {
                    if (levels.includes(incerteza)) {
                      countIncerteza[incerteza]++;
                    }
                    if (levels.includes(impacto)) {
                      countImpacto[impacto]++;
                    }
                  }).catch(function (error) {
                    console.error(`Erro ao obter valores do card ${card.id}:`, error);
                  });
                });

                return Promise.all(cardPromises).then(function () {
                  return t.modal({
                    title: "ArchHypo Metrics",
                    url: "./grafico",  // Página dentro do próprio Power-Up
                    args: {
                      incerteza: countIncerteza,
                      impacto: countImpacto
                    },
                    fullscreen: false
                  });
                });
              }).catch(function (error) {
                console.error("Erro ao obter cartões:", error);
              });
            }
          },
          {
                icon: "https://img.icons8.com/ios/50/000000/plus.png",
                text: "Nova Incerteza",
                callback: function (t) {
                    return t.popup({
                        title: "Criar Card Incerteza",
                        url: "create-card.html",
                        height: 250
                    });
                }
            },
            {
                icon: "https://img.icons8.com/ios/50/000000/ai.png",
                text: "Incerteza GenAI",
                callback: function (t) {
                    return t.popup({
                        title: "Criar Card Incerteza - GenAI",
                        url: "create-card-genai.html",
                        height: 250
                    });
                }
            }
        ];
      },
      'card-badges': function (t, options) {
        return t.get('card', 'shared').then(function (data) {
          let badges = [];
          if (data.incerteza) badges.push({ text: `Incerteza: ${data.incerteza}`, color: 'red' });
          if (data.impacto) badges.push({ text: `Impacto: ${data.impacto}`, color: 'blue' });
          //if (data.dominio_problema) badges.push({ text: `Domínio: ${data.dominio_problema}`, color: 'green' });
          return badges;
        });
      }
    });
  </script>
</body>
</html>
