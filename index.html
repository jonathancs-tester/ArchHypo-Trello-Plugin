      'board-buttons': function (t, options) {
        return [
          {
            icon: "https://img.icons8.com/ios-filled/50/000000/combo-chart.png",
            text: "ArchHypo Metrics",
            callback: function (t) {
              return t.cards('all').then(function (cards) {
                if (!cards || cards.length === 0) {
                  return t.popup({
                    title: 'Error',
                    items: [{ text: 'Nenhum cartão encontrado!', interactive: false }]
                  });
                }

                let levels = ["Very Low","Low","Medium","High","Very High"];

                // Contadores para as novas categorias
                let countIncerteza = { "Very Low": 0,"Low": 0,"Medium": 0,"High": 0,"Very High": 0 };
                let countImpacto = { "Very Low": 0,"Low": 0,"Medium": 0,"High": 0,"Very High": 0 };

                // Novos valores possíveis para 'não funcional' e 'pattern'
                let countNaoFuncional = {
                  "Performance": 0,
                  "Security": 0,
                  "Reliability": 0,
                  "Flexibility": 0,
                  "Usability": 0,
                  "Productivity": 0
                };

                let countPattern = {
                  "Architectural Hypotheses": 0,
                  "Architectural Spike": 0,
                  "Architectural Trigger": 0,
                  "Architecture In The Backlog": 0,
                  "Bring The Specialist": 0,
                  "Choose The Means": 0,
                  "Climbing On The Shoulders Of Giants": 0,
                  "Continuous Inspection": 0,
                  "Define Quality Standards": 0,
                  "Find Where It Hurts": 0,
                  "Hypothesis Impact": 0,
                  "Learning From Experiments": 0,
                  "Plan Analytics Implementation": 0,
                  "Plan For Preparation": 0,
                  "Plan For Responsible Moments": 0,
                  "Postpone Uncertain Decisions": 0,
                  "Protective Guideline": 0,
                  "Quality Checkpoint": 0,
                  "Reachable Goals": 0,
                  "Small Steps For Analytics": 0,
                  "Suspend Measurement": 0,
                  "Technical Debt Management": 0,
                  "Test Architecture": 0,
                  "Tracer Bullets": 0,
                  "Uncertainty Level": 0,
                  "What You Need To Know": 0
                };

                let cardPromises = cards.map(function (card) {
                  return Promise.all([
                    t.get(card.id, 'shared', 'incerteza'),
                    t.get(card.id, 'shared', 'impacto'),
                    t.get(card.id, 'shared', 'dominio_problema'),
                    t.get(card.id, 'shared', 'requisito_nao_funcional'),
                    t.get(card.id, 'shared', 'pattern')
                  ]).then(function ([incerteza, impacto, dominio_problema, requisito_nao_funcional, pattern]) {
                    // Atualiza os contadores de 'incerteza' e 'impacto'
                    if (levels.includes(incerteza)) {
                      countIncerteza[incerteza]++;
                    }
                    if (levels.includes(impacto)) {
                      countImpacto[impacto]++;
                    }

                    // Atualiza os contadores de 'não funcional'
                    if (Object.keys(countNaoFuncional).includes(dominio_problema)) {
                      countNaoFuncional[dominio_problema]++;
                    }

                    // Atualiza os contadores de 'pattern'
                    if (Object.keys(countPattern).includes(pattern)) {
                      countPattern[pattern]++;
                    }
                  }).catch(function (error) {
                    console.error(`Error retrieving card values ${card.id}:`, error);
                  });
                });

                return Promise.all(cardPromises).then(function () {
                  // Passa todos os dados para a URL
                  const params = new URLSearchParams({
                    incerteza: JSON.stringify(countIncerteza),
                    impacto: JSON.stringify(countImpacto),
                    naoFuncional: JSON.stringify(countNaoFuncional),
                    pattern: JSON.stringify(countPattern)
                  }).toString();

                  return t.modal({
                    title: "ArchHypo Metrics",
                    url: `pages/metrics-graph.html?${params}`,  // Passa os dados na URL
                    fullscreen: false,
                    height: 800
                  });
                });
              }).catch(function (error) {

              return [];
            }

            const titulo = card.name.trim(); // Remove espaços extras do título

            return t.get('card', 'shared').then(function (data) {
              let badges = [];

              if (titulo.startsWith("Uncertainty")) {
                if (data.incerteza) badges.push({ text: `Uncertainty: ${data.incerteza}`, color: 'red' });
                if (data.impacto) badges.push({ text: `Impact: ${data.impacto}`, color: 'blue' });
                if (data.pattern) badges.push({ text: `Pattern: ${data.pattern}`, color: 'yellow' });
                if (data.dominio_problema) badges.push({ text: `NFR: ${data.dominio_problema}`, color: 'green' });
              } else {
                // if (data.requisito_nao_funcional) badges.push({ text: `NFR: ${data.requisito_nao_funcional}`, color: 'green' });
              }

              return badges;
