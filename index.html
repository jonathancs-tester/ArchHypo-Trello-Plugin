<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchHypo - Trello Power App</title>
  <style>
    .popup-content {
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./src/create-board-template.js"></script>
  <script>
    TrelloPowerUp.initialize({
      'card-buttons': function (t, options) {
        return [
          {
              icon: "https://img.icons8.com/ios-filled/50/000000/plus.png",
              text: "Technical Plan",
              callback: function (t) {
                t.board('id').then(function (boardId) {     
                return t.card('id', 'name').then(function (card) {
                    return t.modal({
                      title: "Generate Technical Plan",
                      url: `./pages/create-techplan.html?boardId=${boardId.id}&cardId=${card.id}`,
                      height: 500
                    });
                  });
                });
              }
          },
          {
            icon: "https://img.icons8.com/ios-filled/50/000000/process.png",
            text: "Add/Update Metrics",
            callback: function (t) {
              return t.card('name')
                .then(function (card) {
                  if (!card || !card.name) {
                    console.error("Error: Unable to get the card title.");
                    return t.alert({
                      message: "Error getting the card title!",
                      duration: 3,
                      display: "error"
                    });
                  }

                  const titulo = card.name.trim();

                  return t.card('desc')
                    .then(function (cardDesc) {
                      const descricao = cardDesc?.desc?.trim() || "";

                      if (titulo.startsWith("Hypothesis:")) {

                        function extrairValor(chave) {
                          const regex = new RegExp(`\\*\\*${chave}:\\s*\\*\\*\\s*(.*)`, "i");
                          const match = descricao.match(regex);
                          return match ? match[1].trim() : "";
                        }
                        const dominio_problema = extrairValor("Non Functional Requirement");
                        const incerteza = extrairValor("Uncertainty Level");
                        const impacto = extrairValor("Impact Level");
                        const pattern = extrairValor("ArchHypo Pattern");
                        const plano = extrairValor("Technical Plan");

                        return t.set('card', 'shared', {
                          dominio_problema,
                          incerteza,
                          impacto,
                          pattern,
                          plano
                        }).then(function () {
                          return t.alert({
                            message: "Fields added/updated successfully!",
                            duration: 3,
                            display: "success"
                          });
                        });
                      } else {

                        // Função para extrair valores da descrição
                        function extrairValorTask(chave) {
                          const regex = new RegExp(`\\b${chave}\\s*:\\s*(.+)`, "i");
                          const match = descricao.match(regex);
                          return match ? match[1].trim() : "Not found";
                        }

                        const requisito_nao_funcional = extrairValorTask("Non Functional Requirement");
                        const pattern = extrairValorTask("ArchHypo Pattern");

                        return t.set('card', 'shared', {
                          requisito_nao_funcional,
                          pattern
                        }).then(function () {
                          return t.alert({
                            message: "Fields added/updated successfully!",
                            duration: 3,
                            display: "success"
                          });
                        });
                      }
                    });
                })
                .catch(function (error) {
                  console.error("Error processing the card:", error);
                  return t.alert({
                    message: "Unexpected error!",
                    duration: 3,
                    display: "error"
                  });
                });
            }
          }
        ];
      },
      'board-buttons': function (t, options) {
        return t.lists('id', 'name').then(function (lists) {
          const hasUncertaintyColumn = lists.some(list => list.name === 'UNCERTAINTY');

          const buttons = [
            {
              icon: "https://img.icons8.com/ios-filled/50/000000/combo-chart.png",
              text: "ArchHypo Metrics",
              callback: function (t) {
                return t.cards('all').then(function (cards) {
                  if (!cards || cards.length === 0) {
                    return t.popup({
                      title: 'Error',
                      items: [{ text: 'Nenhum cartão encontrado!', interactive: false }]
                    });
                  }

                  let levels = ["Very Low", "Low", "Medium", "High", "Very High"];
                  let countIncerteza = { "Very Low": 0, "Low": 0, "Medium": 0, "High": 0, "Very High": 0 };
                  let countImpacto = { "Very Low": 0, "Low": 0, "Medium": 0, "High": 0, "Very High": 0 };
                  let countNaoFuncional = {
                    "Performance": 0, "Security": 0, "Reliability": 0,
                    "Flexibility": 0, "Usability": 0, "Productivity": 0
                  };
                  let countPattern = {
                    "Architectural Hypotheses": 0, "Architectural Spike": 0, "Architectural Trigger": 0,
                    "Architecture in the Backlog": 0, "Bring the Specialist": 0, "Choose the Means": 0,
                    "Climbing on the Shoulders of Giants": 0, "Continuous Inspection": 0,
                    "Define Quality Standards": 0, "Find Where it Hurts": 0, "Hypothesis Impact": 0,
                    "Learning from Experiments": 0, "Plan Analytics Implementation": 0,
                    "Plan for Preparation": 0, "Plan for Responsible Moments": 0,
                    "Postpone Uncertain Decisions": 0, "Protective Guideline": 0,
                    "Quality Checkpoint": 0, "Reachable Goals": 0, "Small Steps for Analytics": 0,
                    "Suspend Measurement": 0, "Technical Debt Management": 0,
                    "Test Architecture": 0, "Tracer Bullets": 0, "Uncertainty Level": 0,
                    "What you Need to Know": 0
                  };

                  let cardPromises = cards.map(function (card) {
                    return Promise.all([
                      t.get(card.id, 'shared', 'incerteza'),
                      t.get(card.id, 'shared', 'impacto'),
                      t.get(card.id, 'shared', 'dominio_problema'),
                      t.get(card.id, 'shared', 'requisito_nao_funcional'),
                      t.get(card.id, 'shared', 'pattern')
                    ]).then(function ([incerteza, impacto, dominio_problema, requisito_nao_funcional, pattern]) {
                      if (levels.includes(incerteza)) countIncerteza[incerteza]++;
                      if (levels.includes(impacto)) countImpacto[impacto]++;
                      if (Object.keys(countNaoFuncional).includes(dominio_problema)) countNaoFuncional[dominio_problema]++;
                      if (Object.keys(countPattern).includes(pattern)) countPattern[pattern]++;
                    }).catch(function (error) {
                      console.error(`Error retrieving card values ${card.id}:`, error);
                    });
                  });

                  return Promise.all(cardPromises).then(function () {
                    const params = new URLSearchParams({
                      incerteza: JSON.stringify(countIncerteza),
                      impacto: JSON.stringify(countImpacto),
                      naoFuncional: JSON.stringify(countNaoFuncional),
                      pattern: JSON.stringify(countPattern)
                    }).toString();

                    return t.modal({
                      title: "ArchHypo Metrics",
                      url: `pages/metrics-graph.html?${params}`,
                      fullscreen: false,
                      height: 800
                    });
                  });
                }).catch(function (error) {
                  console.error("Error retrieving cards:", error);
                });
              }
            },
            {
              icon: "https://img.icons8.com/ios-filled/50/000000/plus.png",
              text: "New Uncertainty",
              callback: function (t) {
                t.board('id').then(function (boardId) {
                  return t.modal({
                    title: "New Uncertainty",
                    url: `./pages/create-hyphoteses.html?boardId=${boardId.id}`,
                    height: 500
                  });
                });
              }
            }
          ];

          if (!hasUncertaintyColumn) {
            buttons.push({
              icon: "https://img.icons8.com/ios-filled/50/000000/whiteboard.png",
              text: "Create Board Template",
              callback: function (t) {
                t.board('id').then(function (boardId) {
                  createBoardTemplate(boardId.id);
                  return t.popup({
                    title: "Board Template Created",
                    items: [{ text: "The board template has been created successfully!", interactive: false }]
                  });
                });
              }
            });
          }

          return buttons;
        });
      },
      'card-badges': function (t, options) {
        return t.card('name')
          .then(function (card) {
            if (!card || !card.name) {
              console.error("Error: Unable to get the card title.");
              return [];
            }

            const titulo = card.name.trim();

            return t.get('card', 'shared').then(function (data) {
              let badges = [];

              if (titulo.startsWith("Hypothesis:")) {
                if (data.incerteza) badges.push({ text: `Uncertainty: ${data.incerteza}`, color: 'red' });
                if (data.impacto) badges.push({ text: `Impact: ${data.impacto}`, color: 'blue' });
                if (data.dominio_problema) badges.push({ text: `NFR: ${data.dominio_problema}`, color: 'green' });
              } else {
                // if (data.requisito_nao_funcional) badges.push({ text: `NFR: ${data.requisito_nao_funcional}`, color: 'green' });
                if (data.pattern) {
                  const patterns = data.pattern.split(',').map(p => p.trim()).filter(p => p !== '');
                  patterns.forEach(pattern => {
                    badges.push({ text: `Pattern: ${pattern}`, color: 'yellow' });
                  });
                }
              }

              return badges;
            });
          })
          .catch(function (error) {
            console.error("Error processing badges:", error);
            return [];
          });
      }
    });
  </script>
</body>

</html>
