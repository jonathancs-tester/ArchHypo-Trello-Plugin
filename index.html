<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchHypo Metrics</title>
  <style>
    .popup-content {
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script>
    TrelloPowerUp.initialize({
      'card-buttons': function (t, options) {
        return [
          {
            icon: "https://img.icons8.com/ios/50/000000/combo-chart.png",
            text: "Adicionar Campos de Incerteza",
            callback: function (t) {
              return t.get('card', 'shared').then(function (data) {
                return t.set('card', 'shared', {
                  dominio_problema: data.dominio_problema || "Segurança, Confiabilidade",
                  ponto_alerta: data.ponto_alerta || "Integrações falhas podem resultar em dados inconsistentes...",
                  hipotese: data.hipotese || "Implementando mecanismos robustos de validação...",
                  incerteza: data.incerteza || "Médio",
                  impacto: data.impacto || "Alto",
                  plano: data.plano || "Definir um conjunto completo de regras..."
                }).then(function () {
                  return t.alert({
                    message: "Campos adicionados com sucesso!",
                    duration: 3,
                    display: "success"
                  });
                });
              });
            }
          }
        ];
      },
      'board-buttons': function (t, options) {
        return [
          {
            icon: "https://img.icons8.com/ios/50/000000/combo-chart.png",
            text: "ArchHypo Metrics",
            callback: function (t) {
              return t.cards('all').then(function (cards) {
                if (!cards) {
                  return t.popup({
                    title: 'Erro',
                    items: [{ text: 'Nenhum cartão encontrado!', interactive: false }]
                  });
                }
                let cardPromises = cards.map(function (card) {
                  return Promise.all([
                    t.get(card.id, 'shared', 'incerteza'),
                    t.get(card.id, 'shared', 'impacto')
                  ]).then(function ([incerteza, impacto]) {
                    return { incerteza: parseFloat(incerteza) || 0, impacto: parseFloat(impacto) || 0 };
                  });
                });
                return Promise.all(cardPromises).then(function (results) {
                  let totalIncerteza = results.reduce((sum, r) => sum + r.incerteza, 0);
                  let totalImpacto = results.reduce((sum, r) => sum + r.impacto, 0);
                  return t.popup({
                    title: 'ArchHypo Metrics',
                    items: [
                      { text: `Total Incerteza: ${totalIncerteza}`, interactive: false },
                      { text: `Total Impacto: ${totalImpacto}`, interactive: false }
                    ]
                  });
                });
              });
            }
          }
        ];
      },
      'card-badges': function (t, options) {
        return t.get('card', 'shared').then(function (data) {
          let badges = [];
          if (data.incerteza) badges.push({ text: `Incerteza: ${data.incerteza}`, color: 'red' });
          if (data.impacto) badges.push({ text: `Impacto: ${data.impacto}`, color: 'blue' });
          if (data.dominio_problema) badges.push({ text: `Domínio: ${data.dominio_problema}`, color: 'green' });
          return badges;
        });
      }
    });
  </script>
</body>
</html>
