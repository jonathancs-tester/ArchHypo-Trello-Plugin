<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle"></title>
  <style>
    .popup-content {
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./src/i18n.js"></script>
  <script src="./src/create-board-template.js"></script>
  <script>
    // Update title based on current language
    document.getElementById('pageTitle').textContent = I18N.t('pluginTitle');
  </script>
  <script>
    TrelloPowerUp.initialize({
      'card-buttons': function (t, options) {
        return t.card('id', 'name').then(function (card) {
          const buttons = [];

          if (card.name && !card.name.includes("TPI")) {
            buttons.push({
              icon: "https://img.icons8.com/ios-filled/50/000000/plus.png",
              text: I18N.t('technicalPlan'),
              callback: function (t) {
                return t.board('id').then(function (boardId) {
                  return t.modal({
                    title: I18N.t('generateTechnicalPlan'),
                    url: `./pages/create-techplan.html?boardId=${boardId.id}&cardId=${card.id}&lang=${I18N.getCurrentLanguage()}`,
                    height: 500
                  });
                });
              }
            });
          }

          return buttons;
        });
      },
      'board-buttons': function (t, options) {
        return t.lists('id', 'name').then(function (lists) {
          const hasUncertaintyColumn = lists.some(list =>
            list.name === 'INCERTEZA' ||
            list.name === 'UNCERTAINTY' ||
            list.name.toUpperCase().includes('INCERTEZA') ||
            list.name.toUpperCase().includes('UNCERTAINTY')
          );

          const buttons = [
            {
              icon: "https://img.icons8.com/ios-filled/50/000000/combo-chart.png",
              text: I18N.t('archHypoMetrics'),
              callback: function (t) {
                return t.cards('all').then(function (cards) {
                  if (!cards || cards.length === 0) {
                    return t.popup({
                      title: 'Error',
                      items: [{ text: I18N.t('errorNoCards'), interactive: false }]
                    });
                  }

                  let levels = ["Muito Baixo", "Baixo", "Médio", "Alto", "Muito Alto"];
                  let countIncerteza = { "Muito Baixo": 0, "Baixo": 0, "Médio": 0, "Alto": 0, "Muito Alto": 0 };
                  let countImpacto = { "Muito Baixo": 0, "Baixo": 0, "Médio": 0, "Alto": 0, "Muito Alto": 0 };
                  let countNaoFuncional = {
                    "Desempenho": 0, "Segurança": 0, "Confiabilidade": 0,
                    "Flexibilidade": 0, "Usabilidade": 0, "Productividade": 0
                  };
                  let countPattern = {
                    "Architectural Spike": 0,
                    "Architectural Trigger": 0,
                    "Bring the Specialist": 0,
                    "Continuous Inspection": 0,
                    "Learning from Experiments": 0,
                    "Plan for Preparation": 0,
                    "Postpone Uncertain Decisions": 0,
                    "Protective Guideline": 0,
                    "Quality Checkpoint": 0,
                    "Software Analytics": 0,
                    "Technical Debt Management": 0,
                    "Tracer Bullets": 0
                    // "Architectural Hypotheses": 0, "Architectural Spike": 0, "Architectural Trigger": 0,
                    // "Architecture in the Backlog": 0, "Bring the Specialist": 0, "Choose the Means": 0,
                    // "Climbing on the Shoulders of Giants": 0, "Continuous Inspection": 0,
                    // "Define Quality Standards": 0, "Find Where it Hurts": 0, "Hypothesis Impact": 0,
                    // "Learning from Experiments": 0, "Plan Analytics Implementation": 0,
                    // "Plan for Preparation": 0, "Plan for Responsible Moments": 0,
                    // "Postpone Uncertain Decisions": 0, "Protective Guideline": 0,
                    // "Quality Checkpoint": 0, "Reachable Goals": 0, "Small Steps for Analytics": 0,
                    // "Suspend Measurement": 0, "Technical Debt Management": 0,
                    // "Test Architecture": 0, "Tracer Bullets": 0, "Uncertainty Level": 0,
                    // "What you Need to Know": 0
                  };

                  let cardPromises = cards.map(function (card) {
                    return Promise.all([
                      t.get(card.id, 'shared', 'incerteza'),
                      t.get(card.id, 'shared', 'impacto'),
                      t.get(card.id, 'shared', 'dominio_problema'),
                      t.get(card.id, 'shared', 'pattern')
                    ]).then(function ([incerteza, impacto, dominio_problema, pattern]) {
                      if (levels.includes(incerteza)) countIncerteza[incerteza]++;
                      if (levels.includes(impacto)) countImpacto[impacto]++;
                      if (Object.keys(countNaoFuncional).includes(dominio_problema)) countNaoFuncional[dominio_problema]++;
                      if (pattern) {
                        const patterns = pattern.split(',').map(p => p.trim()).filter(p => p !== '');
                        patterns.forEach(p => {
                          if (Object.keys(countPattern).includes(p)) {
                            countPattern[p]++;
                          }
                        });
                      }

                    }).catch(function (error) {
                      console.error(`Error retrieving card values ${card.id}:`, error);
                    });
                  });

                  return Promise.all(cardPromises).then(function () {
                    const params = new URLSearchParams({
                      incerteza: JSON.stringify(countIncerteza),
                      impacto: JSON.stringify(countImpacto),
                      naoFuncional: JSON.stringify(countNaoFuncional),
                      pattern: JSON.stringify(countPattern)
                    }).toString();

                    return t.modal({
                      title: I18N.t('archHypoMetrics'),
                      url: `pages/metrics-graph.html?${params}&lang=${I18N.getCurrentLanguage()}`,
                      fullscreen: false,
                      height: 800
                    });
                  });
                }).catch(function (error) {
                  console.error(I18N.t('errorRetrievingCards'), error);
                });
              }
            },
            {
              icon: "https://img.icons8.com/ios-filled/50/000000/plus.png",
              text: I18N.t('newUncertainty'),
              callback: function (t) {
                t.board('id').then(function (boardId) {
                  return t.modal({
                    title: I18N.t('newUncertainty'),
                    url: `./pages/create-hyphoteses.html?boardId=${boardId.id}&lang=${I18N.getCurrentLanguage()}`,
                    height: 500
                  });
                });
              }
            },
            {
              text: I18N.t('selectLanguage'), // texto do botão principal
              icon: "https://img.icons8.com/?size=100&id=30633&format=png&color=000000",
              callback: function (t) {
                return t.popup({
                  title: I18N.t('selectLanguage'),
                  items: [
                    {
                      text: "🇧🇷 Português",
                      callback: function (t) {
                        I18N.setLanguage("pt");
                        document.getElementById('pageTitle').textContent = I18N.t('pluginTitle');
                        t.set('board', 'shared', 'language', 'pt')
                          .then(() => t.alert({ message: "Idioma alterado para Português 🇧🇷", duration: 2 }));
                      }
                    },
                    {
                      text: "🇬🇧 English",
                      callback: function (t) {
                        I18N.setLanguage("en");
                        document.getElementById('pageTitle').textContent = I18N.t('pluginTitle');
                        t.set('board', 'shared', 'language', 'en')
                          .then(() => t.alert({ message: "Language switched to English 🇬🇧", duration: 2 }));
                      }
                    }
                  ]
                });
              }
            },
            {
              text: I18N.t('metricsToggle'), // texto do botão
              icon: "https://img.icons8.com/ios-filled/50/000000/process.png", // ícone inicial
              callback: function (t) {
                return t.get('board', 'shared', 'enabledMetrics').then(enabled => {
                  const isEnabled = enabled === true;

                  // Retorna o objeto de botão dinâmico
                  return {
                    text: isEnabled ? I18N.t('metricsEnabled') : I18N.t('metricsDisabled'),
                    icon: isEnabled
                      ? "https://img.icons8.com/ios-filled/50/4CAF50/process.png" // verde se ativo
                      : "https://img.icons8.com/ios-filled/50/000000/process.png", // cinza se inativo

                    callback: function (t) {

                      function atualizarMetricas() {
                        return t.cards('all').then(cards => {
                          if (!cards || cards.length === 0) return;

                          const promises = cards.map(card => {
                            return t.card('name', 'desc', { cardId: card.id }).then(cardInfo => {
                              const titulo = cardInfo.name?.trim();
                              const descricao = cardInfo.desc?.trim() || "";

                              if (titulo && titulo.startsWith("H")) {
                                const extrairValor = chave => {
                                  const match = descricao.match(new RegExp(`\\*\\*${chave}:\\s*\\*\\*\\s*(.*)`, "i"));
                                  return match ? match[1].trim() : "";
                                };

                                const dominio_problema = extrairValor(I18N.t('nfrLevelLabel').replace('**', '').replace(':** ', ''));
                                const incerteza = extrairValor(I18N.t('uncertaintyLevelLabel').replace('**', '').replace(':** ', ''));
                                const impacto = extrairValor(I18N.t('impactLevelLabel').replace('**', '').replace(':** ', ''));
                                const pattern = extrairValor(I18N.t('patternLevelLabel').replace('**', '').replace(':** ', ''));
                                const plano = extrairValor(I18N.t('planLevelLabel').replace('**', '').replace(':** ', ''));

                                return t.set(card.id, 'shared', { dominio_problema, incerteza, impacto, pattern, plano });
                              }
                            });
                          });

                          return Promise.all(promises);
                        });
                      }

                      // Alterna o estado do board
                      return t.get('board', 'shared', 'enabledMetrics').then(enabledNow => {
                        const ativo = enabledNow === true;

                        if (!ativo) {
                          return t.set('board', 'shared', 'enabledMetrics', true).then(() => {
                            atualizarMetricas();
                            if (window.metricsInterval) clearInterval(window.metricsInterval);
                            window.metricsInterval = setInterval(atualizarMetricas, 60000);
                            return t.alert({ message: "Métricas habilitadas ✅", duration: 2 });
                          });
                        } else {
                          if (window.metricsInterval) {
                            clearInterval(window.metricsInterval);
                            window.metricsInterval = null;
                          }
                          return t.set('board', 'shared', 'enabledMetrics', false).then(() => {
                            return t.alert({ message: "Métricas desabilitadas ❌", duration: 2 });
                          });
                        }
                      });
                    }
                  };
                });
              }
            }
          ];
          if (!hasUncertaintyColumn) {
            buttons.push({
              icon: "https://img.icons8.com/ios-filled/50/000000/whiteboard.png",
              text: I18N.t('createBoardTemplate'),
              callback: async function (t) {
                try {
                  const board = await t.board('id');
                  await createBoardTemplate(board.id);
                  const updatedBoard = await t.board('all'); // pega dados atualizados
                  console.log("✅ Board atualizado:", updatedBoard);

                } catch (error) {
                  console.error("❌ " + I18N.t('errorCreateBoardTemplate'), error);
                  alert(I18N.t('errorCreateBoardTemplate'));
                }
              }
            });
          }

          return buttons;
        });
      },
      'card-badges': function (t, options) {
        return t.card('name')
          .then(function (card) {
            if (!card || !card.name) {
              console.error(I18N.t('errorGettingCardTitle'));
              return [];
            }

            const titulo = card.name.trim();

            return t.get('card', 'shared').then(function (data) {
              let badges = [];

              if (titulo.includes("TPI")) {
                if (data.pattern) badges.push({ text: `${I18N.t('archHypoPatternBadge')}: ${data.pattern}`, color: 'yellow' });
              } else {
                if (data.incerteza) badges.push({ text: `${I18N.t('uncertaintyBadge')}: ${data.incerteza}`, color: 'red' });
                if (data.impacto) badges.push({ text: `${I18N.t('impactBadge')}: ${data.impacto}`, color: 'blue' });
                if (data.dominio_problema) badges.push({ text: `${I18N.t('nfrBadge')}: ${data.dominio_problema}`, color: 'green' });
              }

              return badges;
            });
          })
          .catch(function (error) {
            console.error(I18N.t('errorProcessingBadges'), error);
            return [];
          });
      }
    });
  </script>
</body>

</html>
