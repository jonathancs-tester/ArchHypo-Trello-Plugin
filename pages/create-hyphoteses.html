<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="pageTitle"></title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #172b4d;
      margin: 40px;
      color: #172b4d;
    }

    h1 {
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: #026aa7;
      text-align: center;
      user-select: none;
    }

    h2 {
      font-weight: 600;
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #172b4d;
    }

    .step {
      display: none;
      background: white;
      max-width: 480px;
      margin: 0 auto 2rem auto;
      padding: 1.8rem 2rem;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(9, 30, 66, .25);
      transition: all 0.3s ease;
    }

    .step.active {
      display: block;
    }

    #loading {
      display: none;
      font-weight: bold;
      color: #333;
      margin: 20px 0;
    }

    .loading-indicator {
      display: none;
      font-weight: bold;
      color: #333;
      margin-top: 10px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      width: 80%;
      border-radius: 8px;
    }

    #uncertaintyList table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    #uncertaintyList th, #uncertaintyList td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    #uncertaintyList th {
      background-color: #f2f2f2;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 1rem;
      font-size: 1.1rem;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      overflow: auto;
      /* ativa scroll se ultrapassar */
      resize: none;
      /* opcional, bloqueia redimensionamento */
      white-space: pre-wrap;
      /* quebra de linha automática */
      word-wrap: break-word;
      /* força quebra de palavra */
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 0.6rem 1rem;
      margin-top: 0.3rem;
      margin-bottom: 1rem;
      font-size: 1rem;
      border: 1px solid #dfe1e6;
      border-radius: 4px;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: #0079bf;
      outline: none;
      box-shadow: 0 0 4px #0079bf;
    }

    button {
      background-color: #5aac44;
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.6rem 1.8rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
      display: inline-block;
      margin-top: 10px;
    }

    button:hover {
      background-color: #519839;
    }

    .help-icon {
      position: relative;
      display: inline-block;
      background-color: #007bff;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      text-align: center;
      line-height: 20px;
      cursor: pointer;
      font-size: 14px;
      margin-left: 8px;
      user-select: none;
    }

    .help-icon:focus,
    .help-icon:hover {
      background-color: #0056b3;
    }

    .tooltip {
      visibility: hidden;
      width: 280px;
      background-color: #333;
      color: #fff;
      text-align: left;
      border-radius: 8px;
      padding: 10px;
      position: absolute;
      z-index: 100;
      top: 25px;
      left: 0;
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 14px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
    }

    .tooltip::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 10px;
      border-width: 6px;
      border-style: solid;
      border-color: transparent transparent #333 transparent;
    }

    .help-icon:hover .tooltip,
    .help-icon:focus .tooltip {
      visibility: visible;
      opacity: 1;
    }

    /* Estilo do <details> para motivo */
    details summary {
      cursor: pointer;
      font-style: italic;
      color: #444;
      user-select: none;
    }

    details summary:hover {
      color: #0079bf;
    }

    details p {
      margin: 10px 0 0 0;
      padding-left: 12px;
      color: #222;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* Estilo do seletor de idioma */
    .language-selector {
      display: flex;
      justify-content: flex-end;
    }

    .language-select {
      background: white;
      border: 2px solid #dfe1e6;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 120px;
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 8px center;
      background-repeat: no-repeat;
      background-size: 16px;
      padding-right: 32px;
      margin-bottom: 0 !important;
    }

    .language-select:hover {
      border-color: #0079bf;
      box-shadow: 0 2px 4px rgba(0, 121, 191, 0.2);
    }

    .language-select:focus {
      border-color: #0079bf;
      outline: none;
      box-shadow: 0 2px 4px rgba(0, 121, 191, 0.3);
    }

    .language-select option {
      padding: 8px;
      background: white;
    }
  </style>
</head>

<body>

  <!-- Step 0 -->
  <div id="step0" class="step active">

    <h2 id="step0Title"></h2>
    <textarea maxlength="300" id="contexto" placeholder=""></textarea>
    <button onclick="analyzeHypothesis()" id="step0NextBtn"></button>
    <div id="loading0" class="loading-indicator"></div>
  </div>

  <!-- Step 1 -->
  <div id="step1" class="step">
    <h2 id="step1Title"></h2>
    <textarea maxlength="300" id="hipotese"></textarea>
    <textarea maxlength="300" id="hipoteseMotivo" style="display: none;"></textarea>
    <p id="hipoteseResultado"></p>
    <button onclick="previousStep()" id="step1PrevBtn"></button>
    <button onclick="analyzeDomain()" id="step1NextBtn"></button>
    <div id="loading1" class="loading-indicator"></div>
  </div>

  <!-- Step 2 -->
  <div id="step2" class="step">
    <h2 id="step2Title"></h2>
    <select id="dominio">
      <option value="Flexibilidade" id="nfrFlexibility"></option>
      <option value="Desempenho" id="nfrPerformance"></option>
      <option value="Productividade" id="nfrProductivity"></option>
      <option value="Confiabilidade" id="nfrReliability"></option>
      <option value="Segurança" id="nfrSecurity"></option>
      <option value="Usabilidade" id="nfrUsability"></option>
    </select>
    <textarea maxlength="300" id="dominioMotivo" style="display: none;"></textarea>
    <p id="dominioResultado"></p>
    <button onclick="previousStep()" id="step2PrevBtn"></button>
    <button onclick="analyzeUncertainty()" id="step2NextBtn"></button>
    <div id="loading2" class="loading-indicator"></div>
  </div>

  <!-- Step 3 -->
  <div id="step3" class="step">
    <h2 id="step3Title">
      <span class="help-icon" tabindex="0" aria-label="Help">
        ❔
        <span class="tooltip" id="uncertaintyTooltip"></span>
      </span>
    </h2>
    <select id="incerteza">
      <option value="Muito Baixo" id="levelVeryLow1"></option>
      <option value="Baixo" id="levelLow1"></option>
      <option value="Médio" id="levelMedium1"></option>
      <option value="Alto" id="levelHigh1"></option>
      <option value="Muito Alto" id="levelVeryHigh1"></option>
    </select>
    <textarea maxlength="300" id="incertezaMotivo" style="display: none;"></textarea>
    <p id="incertezaResultado"></p>
    <button onclick="previousStep()" id="step3PrevBtn"></button>
    <button onclick="analyzeImpact()" id="step3NextBtn"></button>
    <div id="loading3" class="loading-indicator"></div>
  </div>

  <!-- Step 4 -->
  <div id="step4" class="step">
    <h2 id="step4Title">
      <span class="help-icon" tabindex="0" aria-label="Help">
        ❔
        <span class="tooltip" id="impactTooltip"></span>
      </span>
    </h2>
    <select id="impacto">
      <option value="Muito Baixo" id="levelVeryLow2"></option>
      <option value="Baixo" id="levelLow2"></option>
      <option value="Médio" id="levelMedium2"></option>
      <option value="Alto" id="levelHigh2"></option>
      <option value="Muito Alto" id="levelVeryHigh2"></option>
    </select>
    <textarea maxlength="300" id="impactoMotivo" style="display: none;"></textarea>
    <p id="impactoResultado"></p>
    <button onclick="previousStep()" id="step4PrevBtn"></button>
    <button onclick="createCard()" id="step4CreateBtn"></button>
    <div id="loading4" class="loading-indicator"></div>
  </div>

  <!-- Step 5 -->
  <div id="step5" class="step">
    <h2 id="step5Title"></h2>
    <p id="cardLink"></p>
  </div>

<div id="uncertaintyModal" class="modal">
  <div class="modal-content">
    <h2 id="historicalTitle">
    <ul id="uncertaintyList"></ul>
    <div style="margin-top: 20px;">
      <button id="useHistoryBtn"></button>
      <button id="skipHistoryBtn"></button>
    </div>
  </div>
</div>

  <script src="../src/i18n.js"></script>
  <script src="../src/create-hyphoteses.js"></script>
  <script>
    // Initialize i18n for this page
    const urlParams = new URLSearchParams(window.location.search);
    const lang = urlParams.get('lang');
    if (lang) {
      I18N.setLanguage(lang);
    }
  </script>
</body>

</html>
