<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArchHypo - Trello Power App</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #172b4d;
      margin: 40px;
      color: #172b4d;
    }

    h1 {
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: #026aa7;
      text-align: center;
      user-select: none;
    }

    h2 {
      font-weight: 600;
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #172b4d;
    }

    .step {
      display: none;
      background: white;
      max-width: 480px;
      margin: 0 auto 2rem auto;
      padding: 1.8rem 2rem;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(9,30,66,.25);
      transition: all 0.3s ease;
    }

    .step.active {
      display: block;
    }

    #loading { 
      display: none; 
      font-weight: bold; 
      color: #333;
      margin: 20px 0; 
    }

    .loading-indicator {
      display: none;
      font-weight: bold;
      color: #333;
      margin-top: 10px;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 1rem;
      font-size: 1.1rem;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      overflow: auto;  /* ativa scroll se ultrapassar */
      resize: none;    /* opcional, bloqueia redimensionamento */
      white-space: pre-wrap; /* quebra de linha automática */
      word-wrap: break-word; /* força quebra de palavra */
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 0.6rem 1rem;
      margin-top: 0.3rem;
      margin-bottom: 1rem;
      font-size: 1rem;
      border: 1px solid #dfe1e6;
      border-radius: 4px;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: #0079bf;
      outline: none;
      box-shadow: 0 0 4px #0079bf;
    }

    button {
      background-color: #5aac44;
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.6rem 1.8rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
      display: inline-block;
      margin-top: 10px;
    }

    button:hover {
      background-color: #519839;
    }

    .help-icon {
        position: relative;
        display: inline-block;
        background-color: #007bff;
        color: white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        text-align: center;
        line-height: 20px;
        cursor: pointer;
        font-size: 14px;
        margin-left: 8px;
        user-select: none;
    }

    .help-icon:focus,
    .help-icon:hover {
        background-color: #0056b3;
    }

    .tooltip {
        visibility: hidden;
        width: 280px;
        background-color: #333;
        color: #fff;
        text-align: left;
        border-radius: 8px;
        padding: 10px;
        position: absolute;
        z-index: 100;
        top: 25px;
        left: 0;
        opacity: 0;
        transition: opacity 0.3s;
        font-size: 14px;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
    }

    .tooltip::before {
        content: "";
        position: absolute;
        top: -6px;
        left: 10px;
        border-width: 6px;
        border-style: solid;
        border-color: transparent transparent #333 transparent;
    }

    .help-icon:hover .tooltip,
    .help-icon:focus .tooltip {
        visibility: visible;
        opacity: 1;
    }

    /* Estilo do <details> para motivo */
    details summary {
      cursor: pointer;
      font-style: italic;
      color: #444;
      user-select: none;
    }

    details summary:hover {
      color: #0079bf;
    }

    details p {
      margin: 10px 0 0 0;
      padding-left: 12px;
      color: #222;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .plano-item {
      padding: 8px;
      margin: 5px 0;
      background-color: #f4f4f4;
      border-left: 4px solid #007acc;
    }

  </style>
</head>
<body>

  <div id="step0" class="step">
    <h2>1. Technical Plan</h2>
    <div id="planoItensContainer"></div>
    <p id="planoResultado"></p>
    <button onclick="previousStep()">Previous</button>
    <button onclick="analyzePlan()">Generate</button>
    <button onclick="classifyPattern()">Next</button>
    <div id="loading1" class="loading-indicator">⏳ Processing...</div>
  </div>

  <div id="step1" class="step">
    <h2>2. ArchHypo Pattern</h2>
     <textarea id="pattern"></textarea>
    <p id="patternResultado"></p>
    <button onclick="previousStep()">Previous</button>
    <button onclick="createCard()">Next</button>
    <div id="loading2" class="loading-indicator">⏳ Processing...</div>
  </div>

  <div id="step3" class="step">
    <h2>✅ Card created!</h2>
    <p id="cardLink"></p>
  </div>

  <script src="../src/create-hyphoteses.js"></script>
</body>
</html>
