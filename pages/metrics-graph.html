<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchHypo Metrics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Importa Chart.js -->
    <style>
        /* Reset básico de margens e preenchimentos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Definir a fonte e o background geral da página */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0079bf;
            /* Azul do Trello */
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            padding: 20px;
        }

        /* Título principal */
        h3 {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 30px 0 10px 0;
        }

        /* Container para os gráficos */
        .container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Estilo dos gráficos (canvas) */
        canvas {
            width: 80% !important;
            max-width: 800px;
            height: 400px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Adicionar um pequeno espaçamento entre as seções */
        h3+canvas {
            margin-top: 30px;
        }

        /* Adiciona uma estrutura para os gráficos */
        .chart-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }

        /* Rodapé com alguma informação */
        footer {
            margin-top: auto;
            color: white;
            font-size: 14px;
            padding: 10px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>

<body>
    <h3>Uncertainty</h3>
    <canvas id="metricsChart"></canvas>

    <h3>Non Functional Requirement (NFR)</h3>
    <canvas id="naoFuncionalChart"></canvas>

    <h3>ArchHypo Patterns</h3>
    <canvas id="patternChart"></canvas>

    <script>
        // Pega os parâmetros da URL
        const urlParams = new URLSearchParams(window.location.search);

        // Obtenção dos dados para Incerteza e Impacto
        const incerteza = JSON.parse(urlParams.get('incerteza'));
        const impacto = JSON.parse(urlParams.get('impacto'));

        // Dados para o gráfico de Incerteza
        let levelsIncertezaImpacto = ["Very Low","Low","Medium","High","Very High"];
        let incertezaValues = levelsIncertezaImpacto.map(l => incerteza[l] || 0);
        let impactoValues = levelsIncertezaImpacto.map(l => impacto[l] || 0);

        let ctxMetrics = document.getElementById('metricsChart').getContext('2d');
        new Chart(ctxMetrics, {
            type: 'bar',
            data: {
                labels: levelsIncertezaImpacto,
                datasets: [
                    {
                        label: "Uncertainty",
                        data: incertezaValues,
                        backgroundColor: "rgba(54, 162, 235, 0.7)",
                        borderColor: "rgba(54, 162, 235, 1)",
                        borderWidth: 1
                    },
                    {
                        label: "Impact",
                        data: impactoValues,
                        backgroundColor: "rgba(255, 99, 132, 0.7)",
                        borderColor: "rgba(255, 99, 132, 1)",
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Obtenção dos dados para Requisito Não Funcional
        const naoFuncional = JSON.parse(urlParams.get('naoFuncional'));

        // Dados para o gráfico de Requisito Não Funcional
        let levelsNaoFuncional = ["Performance", "Security", "Reliability", "Flexibility", "Usability", "Productivity"];
        let naoFuncionalValues = levelsNaoFuncional.map(l => naoFuncional[l] || 0);

        let ctxNaoFuncional = document.getElementById('naoFuncionalChart').getContext('2d');
        new Chart(ctxNaoFuncional, {
            type: 'bar',
            data: {
                labels: levelsNaoFuncional,
                datasets: [
                    {
                        label: "Non Functional Requirement",
                        data: naoFuncionalValues,
                        backgroundColor: "rgba(75, 192, 192, 0.7)",
                        borderColor: "rgba(75, 192, 192, 1)",
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Obtenção dos dados para Pattern
        const pattern = JSON.parse(urlParams.get('pattern'));

        // Dados para o gráfico de Pattern
        let levelsPattern = [
  "Architectural Hypotheses",
  "Architectural Spike",
  "Architectural Trigger",
  "Architecture In The Backlog",
  "Bring The Specialist",
  "Choose The Means",
  "Climbing On The Shoulders Of Giants",
  "Continuous Inspection",
  "Define Quality Standards",
  "Find Where It Hurts",
  "Hypothesis Impact",
  "Learning From Experiments",
  "Plan Analytics Implementation",
  "Plan For Preparation",
  "Plan For Responsible Moments",
  "Postpone Uncertain Decisions",
  "Protective Guideline",
  "Quality Checkpoint",
  "Reachable Goals",
  "Small Steps For Analytics",
  "Suspend Measurement",
  "Technical Debt Management",
  "Test Architecture",
  "Tracer Bullets",
  "Uncertainty Level",
  "What You Need To Know"
];
        let patternValues = levelsPattern.map(l => pattern[l] || 0);

        let ctxPattern = document.getElementById('patternChart').getContext('2d');
        new Chart(ctxPattern, {
            type: 'bar',
            data: {
                labels: levelsPattern,
                datasets: [
                    {
                        label: "ArchHypo Pattern",
                        data: patternValues,
                        backgroundColor: "rgba(153, 102, 255, 0.7)",
                        borderColor: "rgba(153, 102, 255, 1)",
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>

</html>
