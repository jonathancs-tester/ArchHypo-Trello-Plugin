<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle"></title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Importa Chart.js -->
    <script src="../src/i18n.js"></script>
    <style>
        /* Reset básico de margens e preenchimentos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Definir a fonte e o background geral da página */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0079bf;
            /* Azul do Trello */
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            padding: 20px;
        }

        /* Título principal */
        h3 {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 30px 0 10px 0;
        }

        /* Container para os gráficos */
        .container {
            width: 100%;
            max-width: 1200px;
            height: auto;
            text-align: center;
            background-color: #ffffff;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            margin: 0 auto;
        }

        /* Estilo dos gráficos (canvas) */
        canvas {
            width: 100% !important;
            max-width: 1000px;
            height: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Adicionar um pequeno espaçamento entre as seções */
        h3+canvas {
            margin-top: 30px;
        }

        /* Adiciona uma estrutura para os gráficos */
        .chart-container {
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }

        /* Rodapé com alguma informação */
        footer {
            margin-top: auto;
            color: white;
            font-size: 14px;
            padding: 10px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>

<body>
    <h3 id="uncertaintyChartTitle"></h3>
    <canvas id="metricsChart"></canvas>

    <h3 id="nfrChartTitle"></h3>
    <canvas id="naoFuncionalChart"></canvas>

    <h3 id="patternsChartTitle"></h3>
    <canvas id="patternChart"></canvas>

    <script>
        // Initialize i18n for this page
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang');
        if (lang) {
            I18N.setLanguage(lang);
        }

        // Update page elements with translations
        function updateTexts() {
            document.getElementById('pageTitle').textContent = I18N.t('metricsTitle');
            document.getElementById('uncertaintyChartTitle').textContent = I18N.t('hypothesesHistorical');
            document.getElementById('nfrChartTitle').textContent = I18N.t('nfrChart');
            document.getElementById('patternsChartTitle').textContent = I18N.t('patternsChart');
        }

        updateTexts();
    </script>
    <script>
        // Pega os parâmetros da URL
        const urlParamsMetrics = new URLSearchParams(window.location.search);

        // Obtenção dos dados para Incerteza e Impacto
        const incerteza = JSON.parse(urlParamsMetrics.get('incerteza'));
        const impacto = JSON.parse(urlParamsMetrics.get('impacto'));

        // Get translated level labels
        function getTranslatedLevels() {
            return [
                I18N.t('veryLow'),
                I18N.t('low'),
                I18N.t('medium'),
                I18N.t('high'),
                I18N.t('veryHigh')
            ];
        }

        // Normalized level keys (language independent)
        let levelKeys = ['veryLow', 'low', 'medium', 'high', 'veryHigh'];
        let translatedLevels = getTranslatedLevels();

        let incertezaValues = levelKeys.map(key => incerteza[key] || 0);
        let impactoValues = levelKeys.map(key => impacto[key] || 0);

        let ctxMetrics = document.getElementById('metricsChart').getContext('2d');
        new Chart(ctxMetrics, {
            type: 'bar',
            data: {
                labels: translatedLevels,
                datasets: [
                    {
                        label: I18N.t('uncertaintyBadge'),
                        data: incertezaValues,
                        backgroundColor: "rgba(54, 162, 235, 0.7)",
                        borderColor: "rgba(54, 162, 235, 1)",
                        borderWidth: 1
                    },
                    {
                        label: I18N.t('impactBadge'),
                        data: impactoValues,
                        backgroundColor: "rgba(255, 99, 132, 0.7)",
                        borderColor: "rgba(255, 99, 132, 1)",
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Obtenção dos dados para Requisito Não Funcional
        const naoFuncional = JSON.parse(urlParamsMetrics.get('naoFuncional'));

        // Normalized NFR keys (language independent)
        let nfrKeys = ['flexibility', 'performance', 'productivity', 'reliability', 'security', 'usability'];
        
        // Get translated NFR labels based on current language
        function getTranslatedNFRLabels() {
            return [
                I18N.t('flexibility'),
                I18N.t('performance'),
                I18N.t('productivity'),
                I18N.t('reliability'),
                I18N.t('security'),
                I18N.t('usability')
            ];
        }
        
        let translatedNFRLabels = getTranslatedNFRLabels();
        let naoFuncionalValues = nfrKeys.map(key => naoFuncional[key] || 0);

        let ctxNaoFuncional = document.getElementById('naoFuncionalChart').getContext('2d');
        new Chart(ctxNaoFuncional, {
            type: 'bar',
            data: {
                labels: translatedNFRLabels,
                datasets: [
                    {
                        label: I18N.t('nfrChart'),
                        data: naoFuncionalValues,
                        backgroundColor: "rgba(75, 192, 192, 0.7)",
                        borderColor: "rgba(75, 192, 192, 1)",
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Obtenção dos dados para Pattern
        const pattern = JSON.parse(urlParamsMetrics.get('pattern'));

        // Dados para o gráfico de Pattern
        let levelsPattern = [
            "Architectural Spike",
            "Architectural Trigger",
            "Bring the Specialist",
            "Continuous Inspection",
            "Learning from Experiments",
            "Plan for Preparation",
            "Postpone Uncertain Decisions",
            "Protective Guideline",
            "Quality Checkpoint",
            "Software Analytics",
            "Technical Debt Management",
            "Tracer Bullets"
            // "Architectural Hypotheses",
            // "Architectural Spike",
            // "Architectural Trigger",
            // "Architecture in the Backlog",
            // "Bring the Specialist",
            // "Choose the Means",
            // "Climbing on the Shoulders of Giants",
            // "Continuous Inspection",
            // "Define Quality Standards",
            // "Find Where it Hurts",
            // "Hypothesis Impact",
            // "Learning from Experiments",
            // "Plan Analytics Implementation",
            // "Plan for Preparation",
            // "Plan for Responsible Moments",
            // "Postpone Uncertain Decisions",
            // "Protective Guideline",
            // "Quality Checkpoint",
            // "Reachable Goals",
            // "Small Steps for Analytics",
            // "Suspend Measurement",
            // "Technical Debt Management",
            // "Test Architecture",
            // "Tracer Bullets",
            // "Uncertainty Level",
            // "What you Need to Know"
        ];
        let patternValues = levelsPattern.map(l => pattern[l] || 0);

        let ctxPattern = document.getElementById('patternChart').getContext('2d');
        new Chart(ctxPattern, {
            type: 'bar',
            data: {
                labels: levelsPattern,
                datasets: [
                    {
                        label: I18N.t('patternsChart'),
                        data: patternValues,
                        backgroundColor: "rgba(153, 102, 255, 0.7)",
                        borderColor: "rgba(153, 102, 255, 1)",
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            autoSkip: false,
                            maxRotation: 90,
                            minRotation: 45
                        }
                    },
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>

</html>
