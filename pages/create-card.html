<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <title>Criar Card Incerteza</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0079bf;
            /* Azul do Trello */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #0079bf;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0079bf;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #026aa7;
        }

        button:active {
            background-color: #005b94;
        }

        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Criar Card Incerteza</h2>
        <form id="create-card-form">
            <input type="text" id="dominio" placeholder="Domínio do problema" required />
            <input type="text" id="ponto" placeholder="Ponto de alerta" required />
            <input type="text" id="hipotese" placeholder="Hipótese" required />
            <input type="text" id="incerteza" placeholder="Incerteza" required />
            <input type="text" id="impacto" placeholder="Impacto" required />
            <input type="text" id="plano" placeholder="Plano" required />
            <button type="submit" id="botaoCriar">Criar Card</button>
        </form>
        <p id="status"></p>
    </div>

    <script src="../src/create-card.js"></script>
</body>

</html>
