<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <title>Criar Card Incerteza</title>
    <style>
        /* Estilo baseado no Trello */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0079bf; /* Azul do Trello */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px; /* Aumentando o padding */
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            width: 90%; /* Alterado para ocupar mais espaço */
            max-width: 600px; /* Aumentado para um tamanho maior */
            text-align: center;
        }


        h2 {
            margin-bottom: 15px;
            color: #17394d; /* Azul escuro do Trello */
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 2px solid #dfe1e6; /* Cor de borda dos inputs do Trello */
            border-radius: 3px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #0079bf; /* Azul Trello */
            outline: none;
        }

        button {
            width: 100%;
            background-color: #0079bf; /* Azul Trello */
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #026aa7; /* Azul mais escuro do Trello */
        }

        button:active {
            background-color: #005b94;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Criar Card Incerteza</h2>
        <form id="create-card-form">
            <input type="text" id="dominio" placeholder="Domínio do problema" required />
            <input type="text" id="ponto" placeholder="Ponto de alerta" required />
            <input type="text" id="hipotese" placeholder="Hipótese" required />
            <input type="text" id="incerteza" placeholder="Incerteza" required />
            <input type="text" id="impacto" placeholder="Impacto" required />
            <input type="text" id="plano" placeholder="Plano" required />
            <button type="submit" id="botaoCriar">Criar Card</button>
        </form>
    </div>

    <script src="../src/create-card.js"></script>
</body>
</html>
