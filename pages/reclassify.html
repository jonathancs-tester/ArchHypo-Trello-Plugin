<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Reclassificar Incerteza e Impacto</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #172b4d;
      margin: 40px;
      color: #172b4d;
    }
    h2 {
      font-weight: 600;
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #172b4d;
      text-align: center;
      user-select: none;
    }
    form {
      background: white;
      max-width: 480px;
      margin: 0 auto 2rem auto;
      padding: 1.8rem 2rem;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(9, 30, 66, .25);
      transition: all 0.3s ease;
    }
    label { display: block; margin-top: 20px; }
    select, textarea {
      width: 100%;
      margin-top: 5px;
      font-size: 1.1rem;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      margin-bottom: 1rem;
      transition: border-color 0.3s ease;
    }
    select:focus, textarea:focus {
      border-color: #0079bf;
      outline: none;
      box-shadow: 0 0 4px #0079bf;
    }
    textarea {
      height: 120px;
      resize: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    button {
      background-color: #5aac44;
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.6rem 1.8rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
      display: inline-block;
      margin-top: 10px;
    }
    button:hover {
      background-color: #519839;
    }
  </style>
</head>
<body>
  <h2 id="reclassifyTitle"></h2>
  <form id="reclassifyForm">
    <label for="incerteza" id="incertezaLabel"></label>
    <select id="incerteza" required>
      <option value="" id="selectOption"></option>
      <option value="Muito Baixo" id="veryLowOption"></option>
      <option value="Baixo" id="lowOption"></option>
      <option value="Médio" id="mediumOption"></option>
      <option value="Alto" id="highOption"></option>
      <option value="Muito Alto" id="veryHighOption"></option>
    </select>
    <label for="impacto" id="impactoLabel"></label>
    <select id="impacto" required>
      <option value="" id="selectOption2"></option>
      <option value="Muito Baixo" id="veryLowOption2"></option>
      <option value="Baixo" id="lowOption2"></option>
      <option value="Médio" id="mediumOption2"></option>
      <option value="Alto" id="highOption2"></option>
      <option value="Muito Alto" id="veryHighOption2"></option>
    </select>
    <label for="justificativa" id="justificativaLabel"></label>
    <textarea id="justificativa" maxlength="300" rows="4" required></textarea>
    <button type="submit" id="saveBtn"></button>
  </form>
  <script src="../src/i18n.js"></script>
  <script>
    // Inicializa textos do formulário com I18N
    document.getElementById('reclassifyTitle').textContent = I18N.t('reclassifyTitle') || 'Reclassifique a Incerteza e o Impacto';
    document.getElementById('incertezaLabel').textContent = I18N.t('uncertaintyHistorical') || 'Nível de Incerteza';
    document.getElementById('impactoLabel').textContent = I18N.t('impactHistorical') || 'Nível de Impacto';
  document.getElementById('justificativaLabel').textContent = I18N.t('reclassifyJustification') || 'Justificativa da reclassificação';
  document.getElementById('selectOption').textContent = I18N.t('selectOption') || 'Selecione...';
  document.getElementById('selectOption2').textContent = I18N.t('selectOption') || 'Selecione...';
    document.getElementById('veryLowOption').textContent = I18N.t('veryLowText') || 'Muito Baixo';
    document.getElementById('veryLowOption2').textContent = I18N.t('veryLowText') || 'Muito Baixo';
    document.getElementById('lowOption').textContent = I18N.t('lowText') || 'Baixo';
    document.getElementById('mediumOption').textContent = I18N.t('mediumText') || 'Médio';
    document.getElementById('highOption').textContent = I18N.t('highText') || 'Alto';
    document.getElementById('veryHighOption').textContent = I18N.t('veryHighText') || 'Muito Alto';
    document.getElementById('selectOption2').textContent = I18N.t('selectOption') || 'Selecione...';
    document.getElementById('lowOption2').textContent = I18N.t('lowText') || 'Baixo';
    document.getElementById('mediumOption2').textContent = I18N.t('mediumText') || 'Médio';
    document.getElementById('highOption2').textContent = I18N.t('highText') || 'Alto';
    document.getElementById('veryHighOption2').textContent = I18N.t('veryHighText') || 'Muito Alto';
    document.getElementById('saveBtn').textContent = I18N.t('save') || 'Salvar';
  </script>
  <script src="../src/reclassify.js"></script>
</body>
</html>
