<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Incerteza usando GenAI</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0079bf;
            /* Azul do Trello */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #0079bf;
            /* Cor azul do Trello ao focar */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0079bf;
            /* Azul do Trello */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #026aa7;
            /* Cor mais escura ao passar o mouse */
        }

        button:active {
            background-color: #005b94;
            /* Cor mais escura ao clicar */
        }

        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    <div class="container">
        <label for="incerteza">Digite a Incerteza:</label>
        <input type="text" id="incerteza" placeholder="Ex: Incerteza da IA no mercado" />
        <button id="botaoCriar">Criar Card</button>

        <p id="status"></p>
    </div>

    <script src="../src/create-card-genai.js"></script>

</body>

</html>
