<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <title>Criar Card Incerteza</title>
    <style>
        /* Estilo geral do Trello */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0079bf; /* Azul do Trello */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Botão para abrir o popup */
        .open-popup-btn {
            background-color: #0079bf;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .open-popup-btn:hover {
            background-color: #026aa7;
        }

        /* Fundo do popup */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        /* Conteúdo do popup */
        .popup-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        /* Botão de fechar */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 2px solid #dfe1e6;
            border-radius: 3px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #0079bf;
            outline: none;
        }

        /* Botão de envio */
        button {
            width: 100%;
            background-color: #0079bf;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #026aa7;
        }
    </style>
</head>
<body>
    <button class="open-popup-btn" onclick="openPopup()">Criar Card</button>

    <div class="popup-overlay" id="popup">
        <div class="popup-content">
            <button class="close-btn" onclick="closePopup()">✖</button>
            <h2>Criar Card Incerteza</h2>
            <form id="create-card-form">
                <input type="text" id="dominio" placeholder="Domínio do problema" required />
                <input type="text" id="ponto" placeholder="Ponto de alerta" required />
                <input type="text" id="hipotese" placeholder="Hipótese" required />
                <input type="text" id="incerteza" placeholder="Incerteza" required />
                <input type="text" id="impacto" placeholder="Impacto" required />
                <input type="text" id="plano" placeholder="Plano" required />
                <button type="submit">Criar Card</button>
            </form>
        </div>
    </div>

    <script>
        var t = window.TrelloPowerUp.iframe();

        function openPopup() {
            document.getElementById("popup").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("popup").style.display = "none";
        }

        document.getElementById('create-card-form').addEventListener('submit', function (e) {
            e.preventDefault();

            var data = {
                name: "Incerteza: " + document.getElementById('dominio').value,
                desc: 
                    "**Ponto de alerta:** " + document.getElementById('ponto').value + "\\n" +
                    "**Hipótese:** " + document.getElementById('hipotese').value + "\\n" +
                    "**Incerteza:** " + document.getElementById('incerteza').value + "\\n" +
                    "**Impacto:** " + document.getElementById('impacto').value + "\\n" +
                    "**Plano:** " + document.getElementById('plano').value
            };

            t.board('id')
                .then(function (board) {
                    return fetch(`https://api.trello.com/1/cards?idList=6692d2e23c532f46419fc230&key=eb9d96c766c0a0ba5b9a4db8e940ed4d&token=ATTA3d2621b57146b60ce3b3fa21dc193ad525c1d94ee2bfef004d1a24ed958a92332C751758`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    });
                })
                .then(response => response.json())
                .then(function (result) {
                    console.log("Card criado!", result);
                    closePopup(); // Fecha o popup após a criação do card
                    t.closePopup();
                })
                .catch(function (error) {
                    console.error("Erro ao criar card:", error);
                });
        });
    </script>
</body>
</html>
